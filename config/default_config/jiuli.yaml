# ===== JiuLi 框架专属配置 =====

# ---- 兼容层 ----
compat:
  # 伪装成 TRSS-Yunzai：部分生态插件通过 package.json 的名称/版本判断框架
  # （miao-plugin / genshin / steam-plugin 等），关闭后这些插件可能走错分支
  spoof_yunzai: true
  # 伪装时对外暴露的名称与版本
  name: trss-yunzai
  version: 3.1.3
  # 注入全局变量 Bot / logger / redis / segment / Renderer / plugin
  globals: true
  # 事件对象注入 e.runtime（懒加载，首次访问时创建）
  runtime: true

# ---- 存储 ----
# Redis 不可用且 host 为本机时，降级为内存实现（重启后数据丢失）
redis_fallback: true

# ---- 性能 ----
perf:
  # 插件耗时统计（#性能 指令查看）
  metrics: true
  # 慢插件告警阈值(ms)，0 关闭
  slow_plugin_ms: 3000
  # 消息计数写回间隔(ms)，0 为实时写入
  count_flush_ms: 1000
  # 每条消息只实例化一次插件（TRSS 中 accept / rule 各建一次实例）
  once_instance: true
  # 事件类型索引：按 event 预分组插件，避免每条消息全量遍历
  event_index: true
