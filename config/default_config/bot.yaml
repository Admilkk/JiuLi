# 日志等级 trace,debug,info,warn,fatal,mark,error,off
log_level: info
# 单条日志长度
log_length: 10000
# 对象日志格式
log_object: true
# 日志ID对齐
log_align: "  JiuLi  "
# 同一条日志在这个秒数内重复出现时，终端只留第一条 + 折叠计数（日志文件始终完整；0 关闭）
log_dedupe: 10
# 记录消息收发内容（收 ◀ / 发 ▶），false 则只记录插件执行
log_msg: true
# 消息内容预览长度
log_msg_length: 60
# 指令命中了规则但没有插件响应时，主动提示一句（如非主人使用主人指令）
no_handler_tip: true
# 插件加载超时
plugin_load_timeout: 60
# 监听文件变化
file_watch: true

# 自动更新时间
update_time: 1440
# 自动重启时间
restart_time: 0
# 定时更新cron表达式
update_cron:
# 定时重启cron表达式
restart_cron:
# 定时关机cron表达式
stop_cron:
# 定时开机cron表达式
start_cron:

# 缓存群成员列表
cache_group_member: true
# 上线推送通知的冷却时间
online_msg_exp: 1440
# 文件保存时间
file_to_url_time: 1
# 文件访问次数
file_to_url_times:
# 消息类型统计
msg_type_count: false
# 以/开头转为#
/→#: true

# chromium 其他路径（留空 = 自动挑；自动选择会跳过 snap 版浏览器，snap 沙箱会导致截图缺内容）
# 这个文件在 config/ 下，属于你自己的配置，#更新 不会覆盖
chromium_path:
# puppeteer接口地址
puppeteer_ws:
# puppeteer截图超时时间
puppeteer_timeout:

# 米游社接口代理地址，国际服用
proxyAddress:
